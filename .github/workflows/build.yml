name: Build Separator

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14          # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: WavPack (wird in die App gepackt)
        run: brew install wavpack

      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App-Symbol
        run: |
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon_1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d assets/icon_1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o assets/Separator.icns

      - name: App bauen
        run: pyinstaller packaging/Separator.spec --noconfirm --clean

      - name: Signieren (ad hoc, damit Apple Silicon die App startet)
        run: codesign --force --deep --sign - dist/Separator.app

      - name: Selbsttest im fertigen App-Paket
        run: dist/Separator.app/Contents/MacOS/Separator --selftest

      - name: DMG
        run: |
          mkdir -p dmg && cp -R dist/Separator.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Separator ${VERSION}" -srcfolder dmg -ov -format UDZO "Separator_${VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Separator_${{ env.VERSION }}
          path: Separator_${{ env.VERSION }}.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Separator_${{ env.VERSION }}.dmg
          name: Separator ${{ env.VERSION }}
